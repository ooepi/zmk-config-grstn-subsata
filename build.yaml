# Firmware builds for the Subsata (nice!nano v2).
#
# v1 board:
#   subsata_keys     Keys and encoder only.
#   subsata_full     Keys, encoder, nice!view and LEDs (brightness capped at 20%).
# v2 board:
#   subsata_v2_keys  Keys and encoder only.
#   subsata_v2_full  Keys, encoder, nice!view and LEDs.
# settings_reset     Clears saved settings and Bluetooth pairings. Flash it, then
#                    flash one of the builds above.
---
include:
  - board: nice_nano_v2
    shield: subsata
    artifact-name: subsata_keys
  - board: nice_nano_v2
    shield: subsata nice_view
    cmake-args: -DCONFIG_ZMK_RGB_UNDERGLOW=y
    artifact-name: subsata_full
  - board: nice_nano_v2
    shield: subsata_v2
    artifact-name: subsata_v2_keys
  - board: nice_nano_v2
    shield: subsata_v2 nice_view
    cmake-args: -DCONFIG_ZMK_RGB_UNDERGLOW=y
    artifact-name: subsata_v2_full
  - board: nice_nano_v2
    shield: settings_reset
